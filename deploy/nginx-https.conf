# Replaces nginx-http.conf at the same dedicated site path after certificate issuance.
# This file never declares default_server and never routes another site's hostname.
log_format moduoduowriter_safe escape=json
    '{"time":"$time_iso8601","address":"$remote_addr",'
    '"method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

server {
    listen 80;
    listen [::]:80;
    server_name moduoduowriter.com www.moduoduowriter.com;
    server_tokens off;
    access_log /var/log/nginx/moduoduowriter.access.log moduoduowriter_safe;
    error_log /var/log/nginx/moduoduowriter.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/moduoduowriter-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://moduoduowriter.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.moduoduowriter.com;
    server_tokens off;
    ssl_certificate /etc/moduoduowriter/letsencrypt/live/moduoduowriter.com/fullchain.pem;
    ssl_certificate_key /etc/moduoduowriter/letsencrypt/live/moduoduowriter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log /var/log/nginx/moduoduowriter.access.log moduoduowriter_safe;
    error_log /var/log/nginx/moduoduowriter.error.log warn;
    return 301 https://moduoduowriter.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moduoduowriter.com;
    server_tokens off;
    ssl_certificate /etc/moduoduowriter/letsencrypt/live/moduoduowriter.com/fullchain.pem;
    ssl_certificate_key /etc/moduoduowriter/letsencrypt/live/moduoduowriter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:moduoduowriter_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=604800" always;
    access_log /var/log/nginx/moduoduowriter.access.log moduoduowriter_safe;
    error_log /var/log/nginx/moduoduowriter.error.log warn;
    client_max_body_size 21m;
    client_body_timeout 60s;
    send_timeout 120s;

    # This site is the only trusted proxy to the loopback application port.
    # Replace incoming address headers rather than trusting a caller-supplied chain.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~ (^|/)\. { return 404; }
    location ~ ^/(server|src|scripts|deploy|node_modules)(/|$) { return 404; }
    location = /package.json { return 404; }
    location = /package-lock.json { return 404; }
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18731;
    }
    location / { proxy_pass http://127.0.0.1:18731; }
}
