# Install only this file OR nginx-https.conf at the dedicated site path.
# Until TLS is available, expose ACME validation and a maintenance response only.
# Query strings, cookies, authorization and request bodies are never access-logged.
log_format moduoduowriter_safe escape=json
    '{"time":"$time_iso8601","address":"$remote_addr",'
    '"method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

server {
    listen 80;
    listen [::]:80;
    server_name moduoduowriter.com www.moduoduowriter.com;
    server_tokens off;
    access_log /var/log/nginx/moduoduowriter.access.log moduoduowriter_safe;
    error_log /var/log/nginx/moduoduowriter.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/moduoduowriter-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 3600 always;
        return 503;
    }
}
